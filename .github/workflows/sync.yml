name: Sync site data

on:
  schedule:
    - cron: "7 * * * *"   # every hour, at :07
  workflow_dispatch: {}    # lets you trigger a run manually from the Actions tab

permissions:
  contents: write

concurrency:
  group: jalalonchain-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run sync
        run: python scripts/sync.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes."
            exit 0
          fi
          git commit -m "Auto-sync site data $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for i in 1 2 3 4 5; do
            if git push; then
              echo "Pushed on attempt $i."
              exit 0
            fi
            echo "Push rejected (attempt $i) — rebasing onto latest main before retry."
            git fetch origin main
            # -X ours: on conflict in the generated data/ files, prefer this
            # run's freshly-synced content rather than getting stuck.
            git rebase -X ours origin/main
            sleep $((RANDOM % 5 + 1))
          done
          echo "Gave up after 5 push attempts."
          exit 1
