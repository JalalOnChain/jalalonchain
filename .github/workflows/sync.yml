name: Sync whale data

on:
  schedule:
    - cron: "7 * * * *"   # every hour, at :07
  workflow_dispatch: {}    # lets you trigger a run manually from the Actions tab

permissions:
  contents: write

concurrency:
  group: jalalonchain-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run sync
        env:
          ETHERSCAN_KEY: ${{ secrets.ETHERSCAN_KEY }}
        run: python scripts/sync.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Auto-sync whale data $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi
