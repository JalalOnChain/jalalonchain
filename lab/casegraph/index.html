<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Case Graph</title>
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<meta name="googlebot" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#131B2B">
<link rel="icon" type="image/png" href="/assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root{ --bg:#F4F6F9; --surface:#FFFFFF; --border:#DCE3EC; --text:#131B2B; --text-muted:#5C6B84; --text-faint:#93A1B8; --accent:#B4700F; --teal:#0E8E89; --bad:#B23B3B; --grid:#E6EBF2; color-scheme: light; }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#0B1220; --surface:#121B2E; --border:#233047; --text:#E7ECF5; --text-muted:#93A1B8; --text-faint:#5C6B84; --accent:#E3A857; --teal:#3FD1C9; --bad:#E3897F; --grid:#141F33; color-scheme: dark; }
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; overflow:hidden; background:var(--bg); color:var(--text); font-family:"IBM Plex Sans",system-ui,sans-serif; font-size:13.5px; }
  button,input,select,textarea{ font:inherit; color:inherit; }
  .mono{ font-family:"IBM Plex Mono",monospace; }

  /* top bar */
  #top{ position:fixed; top:0; left:0; right:0; height:52px; display:flex; align-items:center; gap:10px; padding:0 14px; background:var(--surface); border-bottom:1px solid var(--border); z-index:20; }
  #top a.home img{ width:28px; height:28px; border-radius:6px; display:block; }
  #title{ border:1px solid transparent; background:none; font-weight:600; font-size:15px; padding:5px 8px; border-radius:7px; width:260px; min-width:120px; }
  #title:hover{ border-color:var(--border); }
  #title:focus{ outline:none; border-color:var(--teal); }
  #status{ font-size:12px; color:var(--text-faint); white-space:nowrap; }
  .spacer{ flex:1; }
  .btn{ background:var(--bg); border:1px solid var(--border); border-radius:8px; padding:6px 11px; cursor:pointer; white-space:nowrap; font-size:13px; }
  .btn:hover{ border-color:var(--text-faint); }
  .btn.primary{ background:var(--accent); border-color:var(--accent); color:#1a1200; font-weight:600; }
  .btn.small{ padding:4px 9px; font-size:12px; }
  .btn:disabled{ opacity:.5; cursor:default; }
  .menu{ position:relative; }
  .menu-list{ position:absolute; right:0; top:calc(100% + 6px); background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:5px; min-width:200px; display:none; box-shadow:0 8px 24px rgba(0,0,0,.12); }
  .menu.open .menu-list{ display:block; }
  .menu-list button{ display:block; width:100%; text-align:left; background:none; border:none; padding:7px 10px; border-radius:6px; cursor:pointer; }
  .menu-list button:hover{ background:var(--bg); }
  .menu-list hr{ border:none; border-top:1px solid var(--border); margin:4px 0; }

  /* left palette */
  #palette{ position:fixed; top:64px; left:12px; background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:6px; display:flex; flex-direction:column; gap:2px; z-index:10; width:132px; }
  #palette .lbl{ font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--text-faint); padding:6px 8px 3px; font-family:"IBM Plex Mono",monospace; }
  .ptype{ display:flex; align-items:center; gap:8px; padding:6px 8px; border-radius:7px; cursor:pointer; border:1px solid transparent; background:none; text-align:left; }
  .ptype:hover{ background:var(--bg); }
  .ptype.on{ border-color:var(--border); background:var(--bg); font-weight:600; }
  .ptype canvas{ flex:none; }
  #palette .lbl.hdr{ display:flex; justify-content:space-between; align-items:center; }
  #palette .lbl a{ color:var(--teal); text-transform:none; letter-spacing:0; font-family:"IBM Plex Sans",sans-serif; font-size:11.5px; font-weight:500; cursor:pointer; }
  #palette.renaming{ width:172px; }
  .ptype input{ width:100%; min-width:0; background:var(--bg); border:1px solid var(--border); border-radius:6px; padding:3px 6px; font-size:13px; }
  .ptype input:focus{ outline:none; border-color:var(--teal); }
  .renaming .ptype{ cursor:default; padding:4px 6px; }
  .renaming .ptype:hover{ background:none; }
  .rn-actions{ display:none; gap:6px; padding:6px 6px 4px; }
  .renaming .rn-actions{ display:flex; }
  #palette .tog{ display:flex; align-items:center; gap:7px; padding:5px 8px; font-size:12.5px; color:var(--text-muted); cursor:pointer; }

  /* fetch bar */
  #fetchbar{ position:fixed; left:12px; bottom:12px; background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:8px; display:flex; gap:6px; align-items:center; z-index:10; }
  #fetchbar input{ width:340px; background:var(--bg); border:1px solid var(--border); border-radius:8px; padding:6px 9px; font-family:"IBM Plex Mono",monospace; font-size:12.5px; }
  #fetchbar select{ background:var(--bg); border:1px solid var(--border); border-radius:8px; padding:6px; font-size:12.5px; }
  #search{ position:fixed; right:12px; bottom:12px; z-index:10; }
  #search input{ width:220px; background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:8px 11px; }

  /* inspector */
  #insp{ position:fixed; top:64px; right:12px; width:300px; max-height:calc(100% - 130px); overflow:auto; background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:14px; z-index:10; display:none; }
  #insp.show{ display:block; }
  #insp h3{ margin:0 0 10px; font-size:11px; text-transform:uppercase; letter-spacing:.07em; color:var(--text-faint); font-family:"IBM Plex Mono",monospace; display:flex; justify-content:space-between; align-items:center; }
  .f{ margin-bottom:9px; }
  .f label{ display:block; font-size:11.5px; color:var(--text-muted); margin-bottom:3px; }
  .f input,.f select,.f textarea{ width:100%; background:var(--bg); border:1px solid var(--border); border-radius:7px; padding:6px 8px; font-size:13px; }
  .f textarea{ min-height:70px; resize:vertical; }
  .f input.mono{ font-size:12px; }
  .f input:focus,.f select:focus,.f textarea:focus{ outline:none; border-color:var(--teal); }
  .row2{ display:flex; gap:8px; } .row2 .f{ flex:1; min-width:0; }
  .links{ font-size:12px; margin:-2px 0 10px; } .links a{ color:var(--teal); margin-right:10px; }
  .actions{ display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; padding-top:10px; border-top:1px solid var(--border); }
  .pull{ margin-top:10px; padding:10px; background:var(--bg); border-radius:9px; border:1px solid var(--border); }
  .pull .row2 .f{ margin-bottom:6px; }

  #banner{ position:fixed; top:52px; left:0; right:0; z-index:15; background:var(--accent); color:#1a1200; text-align:center; font-size:12.5px; padding:4px; display:none; }
  #help{ position:fixed; left:156px; top:64px; font-size:12px; color:var(--text-faint); z-index:5; pointer-events:none; line-height:1.7; }
  #ctx{ position:fixed; z-index:40; background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:5px; min-width:210px; box-shadow:0 10px 28px rgba(0,0,0,.16); display:none; }
  #ctx.show{ display:block; }
  #ctx .hd{ font-size:10.5px; text-transform:uppercase; letter-spacing:.06em; color:var(--text-faint); padding:6px 10px 4px; font-family:"IBM Plex Mono",monospace; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:260px; }
  #ctx button{ display:flex; align-items:center; gap:10px; width:100%; text-align:left; background:none; border:none; padding:7px 10px; border-radius:6px; cursor:pointer; font-size:13px; }
  #ctx button:hover{ background:var(--bg); }
  #ctx button .sub{ margin-left:auto; font-size:11px; color:var(--text-faint); }
  #ctx hr{ border:none; border-top:1px solid var(--border); margin:4px 0; }
  #ctx svg{ flex:none; }
  #toast{ position:fixed; left:50%; bottom:70px; transform:translateX(-50%); background:var(--text); color:var(--bg); padding:8px 14px; border-radius:9px; font-size:13px; z-index:50; opacity:0; transition:opacity .2s; pointer-events:none; max-width:80vw; }
  #toast.show{ opacity:1; }
  canvas#cv{ position:fixed; top:52px; left:0; display:block; touch-action:none; }

  /* modal */
  #modal{ position:fixed; inset:0; background:rgba(5,10,20,.45); display:none; align-items:center; justify-content:center; z-index:60; }
  #modal.show{ display:flex; }
  #modal .box{ background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:20px 22px; width:min(440px,92vw); max-height:86vh; overflow:auto; }
  #modal h2{ margin:0 0 6px; font-size:16px; }
  #modal p{ margin:0 0 12px; color:var(--text-muted); font-size:13px; line-height:1.55; }
  #modal .f input{ padding:8px 10px; }
  #modal .btns{ display:flex; justify-content:flex-end; gap:8px; margin-top:14px; }
  #modal .err{ color:var(--bad); font-size:12.5px; min-height:18px; }
  .copyrow{ display:flex; gap:6px; } .copyrow input{ flex:1; }
  .glist{ list-style:none; padding:0; margin:0; }
  .glist li{ display:flex; justify-content:space-between; align-items:center; gap:8px; padding:7px 0; border-bottom:1px solid var(--border); }
  .glist li span{ font-size:11.5px; color:var(--text-faint); }
  .viewonly .edit-only{ display:none !important; }
  #landing{ position:fixed; inset:0; z-index:25; background:var(--bg); display:none; align-items:center; justify-content:center; padding:20px; }
  .landing #landing{ display:flex; }
  .landing #top, .landing #palette, .landing #fetchbar, .landing #search, .landing #help, .landing #insp, .landing canvas#cv{ display:none !important; }
  #landing .box{ background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:28px 26px; width:min(440px,100%); text-align:center; }
  #landing h1{ font-size:20px; margin:12px 0 4px; }
  #landing p{ color:var(--text-muted); margin:0 0 18px; }
  #landing input{ flex:1; min-width:0; background:var(--bg); border:1px solid var(--border); border-radius:8px; padding:9px 11px; font-size:15px; }
  #landing .or{ color:var(--text-faint); font-size:12px; margin:14px 0 10px; }
  .mob{ display:none !important; }
  #inspX{ position:absolute; top:6px; right:8px; background:none; border:none; font-size:20px; line-height:1; color:var(--text-faint); cursor:pointer; padding:4px 6px; display:none; }
  #insp{ position:fixed; }
  #insp h3{ padding-right:0; }

  @media (max-width: 760px){
    .mob{ display:block !important; }
    .desk{ display:none !important; }
    #top{ gap:6px; padding:0 8px; }
    #top a.home{ display:none; }
    #title{ flex:1; width:auto; min-width:0; font-size:14px; padding:5px 4px; }
    #status, #help{ display:none; }
    .spacer{ display:none; }
    .btn{ padding:7px 9px; font-size:12.5px; }
    .menu-list{ position:fixed; right:8px; top:50px; min-width:220px; }
    .menu-list button{ padding:10px 12px; font-size:14px; }
    #palette{ top:auto; bottom:62px; left:8px; right:8px; width:auto; flex-direction:row; align-items:center; overflow-x:auto; padding:5px; gap:4px; -webkit-overflow-scrolling:touch; scrollbar-width:none; }
    #palette::-webkit-scrollbar{ display:none; }
    #palette .lbl, #palette .lbl.hdr{ display:none; }
    #palette.renaming{ width:auto; flex-wrap:wrap; max-height:46vh; overflow:auto; }
    #ptypes{ display:flex; gap:2px; }
    .renaming #ptypes{ flex-wrap:wrap; }
    .ptype{ white-space:nowrap; padding:7px 9px; }
    .renaming .ptype{ width:calc(50% - 4px); }
    #palette .tog{ white-space:nowrap; }
    #palette .mob-rn{ display:inline-block !important; white-space:nowrap; }
    .rn-actions{ width:100%; }
    #fetchbar{ left:8px; right:8px; bottom:8px; padding:6px; }
    #fetchbar input{ width:auto; flex:1; min-width:0; font-size:16px; }
    #fetchbar select{ max-width:96px; font-size:14px; }
    #search{ right:8px; top:60px; bottom:auto; }
    #search input{ width:132px; padding:7px 10px; font-size:16px; }
    #insp{ top:auto; left:0; right:0; bottom:0; width:auto; max-height:58vh; border-radius:16px 16px 0 0; z-index:30; padding:16px 14px 20px; box-shadow:0 -8px 24px rgba(0,0,0,.14); }
    #inspX{ display:block; }
    #insp h3{ padding-right:30px; }
    .f input,.f select,.f textarea{ font-size:16px; }
    #toast{ bottom:120px; }
    #ctx button{ padding:11px 12px; font-size:14px; }
    #modal .f input{ font-size:16px; }
  }
</style>
</head>
<body>
<div id="top">
  <a class="home" href="/" title="JalalOnChain"><img src="/assets/logo.png" alt=""></a>
  <input id="title" value="Untitled case" spellcheck="false" class="edit-only-input">
  <span id="status"></span>
  <div class="spacer"></div>
  <button class="btn edit-only desk" id="undoBtn" title="Undo (Ctrl+Z)">Undo</button>
  <button class="btn edit-only desk" id="layoutBtn" title="Shake the layout">Re-layout</button>
  <div class="menu edit-only" id="fileMenu">
    <button class="btn">Graphs ▾</button>
    <div class="menu-list">
      <button data-act="undo" class="mob">Undo</button>
      <button data-act="relayout" class="mob">Re-layout</button>
      <hr class="mob">
      <button data-act="new">New graph</button>
      <button data-act="mine">My saved graphs</button>
      <hr>
      <button data-act="importEnc">Open encrypted file…</button>
      <button data-act="importJson">Import JSON…</button>
      <hr>
      <button data-act="settings">GitHub token…</button>
    </div>
  </div>
  <div class="menu" id="exportMenu">
    <button class="btn">Export ▾</button>
    <div class="menu-list">
      <button data-act="png">PNG image</button>
      <button data-act="json" class="edit-only">JSON (unencrypted)</button>
      <button data-act="enc" class="edit-only">Encrypted file</button>
    </div>
  </div>
  <button class="btn edit-only" id="saveBtn">Save</button>
  <button class="btn primary edit-only" id="shareBtn">Share</button>
</div>
<div id="banner"></div>
<div id="landing">
  <div class="box">
    <img src="/assets/logo.png" alt="" width="40" height="40" style="border-radius:9px">
    <h1>Case Graph</h1>
    <p>Open a graph that was shared with you.</p>
    <div class="copyrow"><input id="landLink" placeholder="Paste the link you received" spellcheck="false"><button class="btn primary" id="landOpen">Open</button></div>
    <div class="or">or</div>
    <button class="btn" id="landFile">Open a file</button>
  </div>
</div>

<div id="palette" class="edit-only">
  <div class="lbl hdr"><span>New node</span><a id="rnLink" title="Rename node types">Rename</a></div>
  <div id="ptypes"></div>
  <div class="rn-actions"><button class="btn small primary" id="rnDone">Done</button><button class="btn small" id="rnReset">Reset names</button></div>
  <div class="lbl">Options</div>
  <label class="tog"><input type="checkbox" id="physics" checked> Physics</label>
  <label class="tog"><input type="checkbox" id="edgeLabels" checked> Edge labels</label>
  <label class="tog"><input type="checkbox" id="edgeTimes"> Edge times</label>
  <a class="btn small mob-rn" id="rnLink2" style="display:none">Rename types</a>
</div>
<div id="help" class="edit-only">Double-click to add a node · Right-click a node to link it · Drag a selected link's end to move it · Del to remove</div>

<canvas id="cv"></canvas>

<div id="fetchbar" class="edit-only">
  <select id="chainSel" title="Chain"></select>
  <input id="fetchInput" placeholder="Paste address or tx hash" spellcheck="false">
  <button class="btn" id="fetchBtn">Add</button>
</div>
<div id="search"><input id="searchInput" placeholder="Find node…" spellcheck="false"></div>

<div id="insp"></div>
<div id="toast"></div>
<div id="ctx"></div>
<div id="modal"><div class="box" id="modalBox"></div></div>

<input type="file" id="fileIn" hidden>

<script>
(function(){
"use strict";

/* ------------------------------------------------------------------ config */
var ETHERSCAN_API_KEY = "F4JZ76GDDH4HN1KDGZ9F3W532QAS46JCZ3";
var ETHERSCAN_BASE = "https://api.etherscan.io/v2/api";
var CHAINS = {
  "1":     { name:"Ethereum", sym:"ETH",  explorer:"https://etherscan.io" },
  "42161": { name:"Arbitrum", sym:"ETH",  explorer:"https://arbiscan.io" },
  "137":   { name:"Polygon",  sym:"POL",  explorer:"https://polygonscan.com" },
  "8453":  { name:"Base",     sym:"ETH",  explorer:"https://basescan.org" },
  "10":    { name:"Optimism", sym:"ETH",  explorer:"https://optimistic.etherscan.io" },
  "56":    { name:"BNB Chain",sym:"BNB",  explorer:"https://bscscan.com" }
};
var GIST_FILE = "cg.enc.json";
var KDF_ITER = 310000;

var TYPES = {
  address:  { name:"Address",  color:"#0E8E89", dark:"#3FD1C9", r:15 },
  tx:       { name:"Tx",       color:"#5C6B84", dark:"#93A1B8", r:11 },
  exchange: { name:"Exchange", color:"#2F6FB0", dark:"#6FA8E6", r:17 },
  mixer:    { name:"Mixer",    color:"#B23B3B", dark:"#E3897F", r:17 },
  entity:   { name:"Entity",   color:"#B4700F", dark:"#E3A857", r:17, hint:"Business / service" },
  defi:     { name:"DeFi",     color:"#6B4FA0", dark:"#A88BD8", r:17 },
  contract: { name:"Contract", color:"#3D5A4C", dark:"#86B39C", r:16 },
  note:     { name:"Note",     color:"#7D7350", dark:"#C9BC8C", r:0 }
};
var KINDS = {
  transfer:  { name:"Transfer",       hint:"Straight line",  dash:[],      color:null,      dark:null,      arrow:true },
  bridge:    { name:"Bridge",         hint:"Cross-chain",    dash:[9,5],   color:"#6E52A8", dark:"#B39DDB", arrow:true },
  swap:      { name:"Swap",           hint:"Token in → out", dash:[1,4],   color:"#B4700F", dark:"#E3A857", arrow:true, round:true },
  suspected: { name:"Suspected link", hint:"No funds moved", dash:[4,7],   color:"#93A1B8", dark:"#5C6B84", arrow:false }
};
function kindOf(e){ return KINDS[e.kind] ? e.kind : "transfer"; }
var RISK = { "":null, low:"#5E9C5A", medium:"#C98A1B", high:"#C0392B" };

/* ------------------------------------------------------------------ state */
var doc = null; doc = blankDoc();
var meta = { gistId:null, password:null, owner:true };   // password lives in memory only
var readOnly = false;
var sel = null;              // {kind:'node'|'edge', id}
var curType = "address";
var view = { x:0, y:0, k:1 };
var hist = [], redo = [];
var dirty = false, alpha = 1;
var dark = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches;

function blankDoc(){ return { v:1, title:"Untitled case", nodes:[], edges:[], typeNames:Object.assign({}, doc && doc.typeNames || {}), updated:Date.now() }; }
function typeName(t){ return (doc.typeNames && doc.typeNames[t]) || (TYPES[t]||TYPES.address).name; }
function uid(){ return Math.random().toString(36).slice(2,10); }
function $(id){ return document.getElementById(id); }
var nidx = {};
function reindex(){ nidx = {}; doc.nodes.forEach(function(n){ nidx[n.id]=n; }); }
function nodeById(id){ if (nidx[id]) return nidx[id]; for (var i=0;i<doc.nodes.length;i++) if (doc.nodes[i].id===id){ nidx[id]=doc.nodes[i]; return doc.nodes[i]; } return null; }
function edgeById(id){ for (var i=0;i<doc.edges.length;i++) if (doc.edges[i].id===id) return doc.edges[i]; return null; }
function short(a){ return a && a.length>14 ? a.slice(0,6)+"…"+a.slice(-4) : (a||""); }
function isAddr(s){ return /^0x[a-fA-F0-9]{40}$/.test(s); }
function isHash(s){ return /^0x[a-fA-F0-9]{64}$/.test(s); }
function css(v){ return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }
function typeColor(t){ var T=TYPES[t]||TYPES.address; return dark?T.dark:T.color; }

function toast(msg, ms){ var t=$("toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(toast._t); toast._t=setTimeout(function(){ t.classList.remove("show"); }, ms||2600); }

/* ------------------------------------------------------------------ history / persistence */
function snapshot(){ return JSON.stringify({nodes:doc.nodes, edges:doc.edges, title:doc.title, typeNames:doc.typeNames||{}}); }
function pushHist(){ if (readOnly) return; hist.push(snapshot()); if (hist.length>60) hist.shift(); redo=[]; }
function restore(s){ var o=JSON.parse(s); doc.nodes=o.nodes; doc.edges=o.edges; reindex(); doc.title=o.title; doc.typeNames=o.typeNames||{}; refreshPalette(); $("title").value=doc.title; sel=null; renderInsp(); changed(true); }
function undo(){ if(!hist.length) return; redo.push(snapshot()); restore(hist.pop()); }
function redoFn(){ if(!redo.length) return; hist.push(snapshot()); restore(redo.pop()); }

var saveT;
function persistLocal(){
  if (readOnly) return;
  clearTimeout(saveT);
  saveT = setTimeout(function(){
    try { localStorage.setItem("cg.current", JSON.stringify({ doc:cleanDoc(), gistId:meta.gistId, dirty:dirty })); } catch(e){}
  }, 400);
}
function changed(noReheat){
  if (readOnly) return;
  doc.updated = Date.now(); dirty = true; setStatus();
  if (!noReheat) alpha = Math.max(alpha, 0.3);
  persistLocal(); scheduleAutoSave();
}
function setStatus(){
  var s = readOnly ? "View only" : (meta.gistId ? (dirty ? (meta.password ? "Auto-saving soon" : "Unsaved changes") : "Saved to cloud") : "Draft, not saved yet");
  $("status").textContent = s + " · " + doc.nodes.length + " nodes";
}

/* ------------------------------------------------------------------ crypto */
var enc = new TextEncoder(), dec = new TextDecoder();
function b64(u8){ var s=""; for (var i=0;i<u8.length;i+=0x8000) s+=String.fromCharCode.apply(null, u8.subarray(i,i+0x8000)); return btoa(s); }
function unb64(s){ var b=atob(s), u=new Uint8Array(b.length); for (var i=0;i<b.length;i++) u[i]=b.charCodeAt(i); return u; }
async function deriveKey(pw, salt, iter){
  var base = await crypto.subtle.importKey("raw", enc.encode(pw), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({ name:"PBKDF2", salt:salt, iterations:iter, hash:"SHA-256" }, base, { name:"AES-GCM", length:256 }, false, ["encrypt","decrypt"]);
}
function b64u(u8){ return b64(u8).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,""); }
function unb64u(s){ s=s.replace(/-/g,"+").replace(/_/g,"/"); while (s.length%4) s+="="; return unb64(s); }
function aesKey(raw){ return crypto.subtle.importKey("raw", raw, "AES-GCM", false, ["encrypt","decrypt"]); }
// v2 format: the graph is encrypted with a random content key (dek); the dek is wrapped with the password.
// A view-only link carries the dek in the URL fragment (never sent to any server), so it can read but has no password.
async function encryptDoc(d, pw, dek){
  dek = dek || crypto.getRandomValues(new Uint8Array(32));
  var salt = crypto.getRandomValues(new Uint8Array(16)), wiv = crypto.getRandomValues(new Uint8Array(12)), iv = crypto.getRandomValues(new Uint8Array(12));
  var kek = await deriveKey(pw, salt, KDF_ITER);
  var wk = new Uint8Array(await crypto.subtle.encrypt({ name:"AES-GCM", iv:wiv }, kek, dek));
  var ct = new Uint8Array(await crypto.subtle.encrypt({ name:"AES-GCM", iv:iv }, await aesKey(dek), enc.encode(JSON.stringify(d))));
  return { dek:dek, text: JSON.stringify({ cg:2, kdf:"PBKDF2-SHA256", iter:KDF_ITER, salt:b64(salt), wiv:b64(wiv), wk:b64(wk), iv:b64(iv), ct:b64(ct) }) };
}
function parseBlob(text){ var o; try { o = JSON.parse(text); } catch(e){} if (!o || (o.cg!==1 && o.cg!==2)) throw new Error("Not a case graph file."); return o; }
async function decryptDoc(text, pw){
  var o = parseBlob(text);
  var kek = await deriveKey(pw, unb64(o.salt), o.iter||KDF_ITER), dek = null, key = kek;
  try {
    if (o.cg===2){ dek = new Uint8Array(await crypto.subtle.decrypt({ name:"AES-GCM", iv:unb64(o.wiv) }, kek, unb64(o.wk))); key = await aesKey(dek); }
    var pt = await crypto.subtle.decrypt({ name:"AES-GCM", iv:unb64(o.iv) }, key, unb64(o.ct));
  } catch(e){ throw new Error("Wrong password."); }
  return { doc: JSON.parse(dec.decode(pt)), dek: dek };
}
async function decryptWithKey(text, dek){
  var o = parseBlob(text);
  if (o.cg!==2) throw new Error("This view link is out of date. Ask for a new one.");
  try { var pt = await crypto.subtle.decrypt({ name:"AES-GCM", iv:unb64(o.iv) }, await aesKey(dek), unb64(o.ct)); }
  catch(e){ throw new Error("This view link no longer works. The owner may have reset it."); }
  return JSON.parse(dec.decode(pt));
}
// fingerprint of the evidence content (positions excluded, so moving nodes around doesn't change it)
async function fingerprint(d){
  var pick = function(o, skip){ var r={}; Object.keys(o).sort().forEach(function(k){ if (skip.indexOf(k)<0 && k[0]!=="_" && o[k]!=="" && o[k]!=null) r[k]=o[k]; }); return r; };
  var c = { title:d.title||"", typeNames:d.typeNames||{},
    nodes:(d.nodes||[]).map(function(n){ return pick(n,["x","y","vx","vy","pinned"]); }).sort(function(a,b){ return a.id<b.id?-1:1; }),
    edges:(d.edges||[]).map(function(e){ return pick(e,[]); }).sort(function(a,b){ return a.id<b.id?-1:1; }) };
  var h = new Uint8Array(await crypto.subtle.digest("SHA-256", enc.encode(JSON.stringify(c))));
  var hex = Array.prototype.map.call(h, function(x){ return ("0"+x.toString(16)).slice(-2); }).join("").toUpperCase();
  return hex.slice(0,16).match(/.{4}/g).join(" ");
}
function fmtWhen(ms){ return new Date(ms).toLocaleString("en-IN",{timeZone:"Asia/Kolkata",dateStyle:"medium",timeStyle:"short"})+" IST"; }

/* ------------------------------------------------------------------ GitHub gist storage */
function ghToken(){ try { return localStorage.getItem("cg.ghToken") || ""; } catch(e){ return ""; } }
function myGraphs(){ try { return JSON.parse(localStorage.getItem("cg.index")||"[]"); } catch(e){ return []; } }
function setMyGraphs(a){ try { localStorage.setItem("cg.index", JSON.stringify(a)); } catch(e){} }
function rememberGraph(id, title){
  var a = myGraphs().filter(function(g){ return g.id!==id; });
  a.unshift({ id:id, title:title, updated:Date.now() }); setMyGraphs(a);
}
async function gh(method, path, body){
  var res = await fetch("https://api.github.com"+path, {
    method:method,
    headers:{ "Accept":"application/vnd.github+json", "Authorization":"Bearer "+ghToken(), "Content-Type":"application/json" },
    body: body ? JSON.stringify(body) : undefined
  });
  if (!res.ok){ var t=""; try{ t=(await res.json()).message; }catch(e){} throw new Error("GitHub "+res.status+(t?": "+t:"")); }
  return res.json();
}
var autoT = null, saving = false;
function scheduleAutoSave(){
  clearTimeout(autoT);
  if (readOnly || !meta.gistId || !meta.password || !ghToken()) return;
  autoT = setTimeout(function(){ if (dirty && !saving) saveCloud(true); }, 12000);
}
async function saveCloud(silent){
  if (saving) return;
  if (!ghToken()){ if (!silent) openSettings(true); return; }
  if (!meta.password && meta.gistId){
    var g0; try { g0 = await fetchGist(meta.gistId); } catch(e){ toast(e.message,5000); return; }
    var r0 = await askPassword("Unlock to save", "Enter this graph's current password so the update keeps working for the people you shared it with.", function(pw){ return decryptDoc(g0.content, pw); });
    if (!r0) return;
    meta.password = r0.pw; meta.dek = r0.value.dek;
  }
  if (!meta.password){ var pw = await askNewPassword(); if (!pw) return; meta.password = pw; }
  saving = true; $("saveBtn").disabled = true; $("saveBtn").textContent = "Saving…";
  try {
    doc.updated = Date.now();
    var out = await encryptDoc(cleanDoc(), meta.password, meta.dek); meta.dek = out.dek;
    var payload = out.text;
    var files = {}; files[GIST_FILE] = { content: payload };
    if (meta.gistId){
      await gh("PATCH", "/gists/"+meta.gistId, { files:files });
    } else {
      var g = await gh("POST", "/gists", { description:"cg", public:false, files:files });
      meta.gistId = g.id;
    }
    rememberGraph(meta.gistId, doc.title);
    dirty = false; setStatus(); persistLocal();
    if (!silent) toast("Saved");
    return true;
  } catch(e){ toast(silent ? "Auto-save failed: "+e.message : e.message, 5000); }
  finally { saving = false; $("saveBtn").disabled=false; $("saveBtn").textContent="Save"; }
}
async function fetchGist(id){
  var res = await fetch("https://api.github.com/gists/"+encodeURIComponent(id), { headers:{ "Accept":"application/vnd.github+json" } });
  if (res.status===404) throw new Error("Graph not found. The link may be wrong or the graph was removed.");
  if (!res.ok) throw new Error("Couldn't load graph (HTTP "+res.status+"). Try again in a bit.");
  var g = await res.json(), f = g.files && g.files[GIST_FILE];
  if (!f) throw new Error("This link doesn't point to a case graph.");
  var content = f.content;
  if (f.truncated){ var r = await fetch(f.raw_url); content = await r.text(); }
  return { content:content, owner: g.owner && g.owner.login };
}

/* ------------------------------------------------------------------ modal helpers */
function modal(html){ $("modalBox").innerHTML = html; $("modal").classList.add("show"); var i=$("modalBox").querySelector("input"); if(i) setTimeout(function(){ i.focus(); },30); }
function closeModal(){ $("modal").classList.remove("show"); }
$("modal").addEventListener("mousedown", function(e){ if (e.target===$("modal") && !$("modal").dataset.locked) closeModal(); });

function askNewPassword(title){
  return new Promise(function(resolve){
    modal('<h2>'+(title||'Set a password for this graph')+'</h2><p>The graph is encrypted in your browser before it leaves your device. Anyone you share it with needs this password, so send it to them separately (not in the same message as the link). If you lose it, the graph can\'t be recovered.</p>'+
      '<div class="f"><label>Password</label><input type="password" id="pw1" autocomplete="new-password"></div>'+
      '<div class="f"><label>Confirm</label><input type="password" id="pw2" autocomplete="new-password"></div><div class="err" id="pwErr"></div>'+
      '<div class="btns"><button class="btn" id="pwCancel">Cancel</button><button class="btn primary" id="pwOk">Encrypt &amp; save</button></div>');
    function ok(){ var a=$("pw1").value, b=$("pw2").value;
      if (a.length<10){ $("pwErr").textContent="Use at least 10 characters."; return; }
      if (a!==b){ $("pwErr").textContent="Passwords don't match."; return; }
      closeModal(); resolve(a); }
    $("pwOk").onclick = ok; $("pw2").onkeydown=function(e){ if(e.key==="Enter") ok(); };
    $("pwCancel").onclick = function(){ closeModal(); resolve(null); };
  });
}
// verify(pw) must resolve with a value or throw; the dialog stays open until it succeeds or is cancelled
function askPassword(title, text, verify){
  return new Promise(function(resolve){
    $("modal").dataset.locked = "1";
    modal('<h2>'+title+'</h2><p>'+text+'</p><div class="f"><input type="password" id="pwIn" autocomplete="current-password" placeholder="Password"></div><div class="err" id="pwErr"></div>'+
      '<div class="btns"><button class="btn" id="pwCancel">Cancel</button><button class="btn primary" id="pwOk">Open</button></div>');
    var busy = false;
    var tryIt = async function(){
      if (busy) return; busy = true; $("pwErr").textContent = ""; $("pwOk").textContent = "Checking…";
      var pw = $("pwIn").value;
      try { var out = await verify(pw); delete $("modal").dataset.locked; closeModal(); resolve({ pw:pw, value:out }); }
      catch(e){ $("pwErr").textContent = e.message; $("pwOk").textContent = "Open"; $("pwIn").select(); }
      busy = false;
    };
    $("pwOk").onclick = tryIt; $("pwIn").onkeydown=function(e){ if(e.key==="Enter") tryIt(); };
    $("pwCancel").onclick = function(){ delete $("modal").dataset.locked; closeModal(); resolve(null); };
  });
}
function openSettings(thenSave){
  modal('<h2>GitHub token</h2><p>Graphs are stored as <b>secret gists</b> on your GitHub account, and only the encrypted data is uploaded. Create a fine-grained or classic token with only the <span class="mono">gist</span> permission at github.com/settings/tokens and paste it here. It\'s kept in this browser only.</p>'+
    '<div class="f"><input type="password" id="tokIn" class="mono" placeholder="ghp_… or github_pat_…" value=""></div><div class="err" id="tokErr"></div>'+
    '<div class="btns"><button class="btn" id="tokClear">Remove</button><button class="btn" id="tokCancel">Cancel</button><button class="btn primary" id="tokOk">Save token</button></div>');
  $("tokIn").value = ghToken();
  $("tokCancel").onclick = closeModal;
  $("tokClear").onclick = function(){ try{ localStorage.removeItem("cg.ghToken"); }catch(e){} closeModal(); toast("Token removed"); };
  $("tokOk").onclick = async function(){
    var t = $("tokIn").value.trim(); if (!t) return;
    try { localStorage.setItem("cg.ghToken", t); } catch(e){}
    try { await gh("GET", "/gists?per_page=1"); } catch(e){ $("tokErr").textContent = "Token didn't work: "+e.message; return; }
    closeModal(); toast("Token saved"); if (thenSave) saveCloud();
  };
}
function shareLink(){ return location.origin + location.pathname + "#g=" + meta.gistId; }
function viewLink(){ return location.origin + location.pathname + "#v=" + meta.gistId + "." + b64u(meta.dek); }
async function openShare(){
  if (!meta.gistId || dirty || !meta.dek){ if (!meta.dek && meta.gistId) dirty = true; var ok = await saveCloud(); if (!ok) return; }
  if (!meta.gistId || !meta.dek) return;
  var fp = await fingerprint(doc);
  modal('<h2>Share this graph</h2>'+
    '<p><b>View-only link.</b> Anyone with this link can open the graph and move nodes around to read it, but they can\'t edit, delete or save anything. Your copy is never touched. No password is needed, so treat it like sending a PNG.</p>'+
    '<div class="f"><div class="copyrow"><input id="shView" class="mono" readonly><button class="btn primary" id="shViewCopy">Copy</button></div></div>'+
    '<p style="margin-top:14px"><b>Password link.</b> Also view-only for everyone except you. Send the password separately.</p>'+
    '<div class="f"><div class="copyrow"><input id="shLink" class="mono" readonly><button class="btn" id="shCopy">Copy</button></div></div>'+
    '<p style="margin-top:14px;font-size:12.5px">Evidence fingerprint <span class="mono" style="color:var(--text)">'+fp+'</span>. Viewers see the same code, so they can confirm they\'re looking at exactly what you saved on '+esc(fmtWhen(doc.updated||Date.now()))+'. Moving nodes doesn\'t change it, but any edit to the content does.</p>'+
    '<p style="font-size:12.5px"><b>Reset view link</b> kills every view-only link sent so far. <b>Change password</b> does the same for password links. <b>Delete</b> removes the stored graph completely.</p>'+
    '<div class="btns" style="flex-wrap:wrap"><button class="btn" id="shDel" style="margin-right:auto;color:var(--bad)">Delete</button><button class="btn" id="shReset">Reset view link</button><button class="btn" id="shPw">Change password</button><button class="btn primary" id="shDone">Done</button></div>');
  $("shView").value = viewLink(); $("shLink").value = shareLink();
  var cp = function(inp, msg){ inp.select(); navigator.clipboard.writeText(inp.value).then(function(){ toast(msg); }, function(){ toast("Select the link and copy it"); }); };
  $("shViewCopy").onclick = function(){ cp($("shView"), "View-only link copied"); };
  $("shCopy").onclick = function(){ cp($("shLink"), "Password link copied"); };
  $("shDone").onclick = closeModal;
  $("shPw").onclick = async function(){ closeModal(); var pw = await askNewPassword(); if (!pw) return; meta.password = pw; dirty=true; if (await saveCloud()) toast("Password changed. Old password no longer works"); };
  $("shReset").onclick = async function(){
    var b=$("shReset"); if (!b.dataset.armed){ b.dataset.armed="1"; b.textContent="Click again to reset"; return; }
    meta.dek = null; dirty = true; closeModal();
    if (await saveCloud()){ toast("Old view links stopped working"); openShare(); }
  };
  $("shDel").onclick = async function(){
    if (!confirmInline()) return;
    try { await gh("DELETE", "/gists/"+meta.gistId); } catch(e){ toast(e.message,5000); return; }
    setMyGraphs(myGraphs().filter(function(g){ return g.id!==meta.gistId; }));
    meta.gistId=null; meta.password=null; meta.dek=null; dirty=true; setStatus(); closeModal(); toast("Deleted from GitHub. The draft is still open here");
  };
  function confirmInline(){ var b=$("shDel"); if (b.dataset.armed) return true; b.dataset.armed="1"; b.textContent="Click again to delete"; return false; }
}
async function openMine(){
  if (!ghToken()){ openSettings(false); return; }
  modal('<h2>My saved graphs</h2><p>Loading…</p>');
  var list = [];
  try {
    for (var page=1; page<=5; page++){
      var arr = await gh("GET", "/gists?per_page=100&page="+page);
      arr.forEach(function(g){ if (g.files && g.files[GIST_FILE]) list.push({ id:g.id, updated:Date.parse(g.updated_at) }); });
      if (arr.length<100) break;
    }
  } catch(e){ modal('<h2>My saved graphs</h2><p>'+esc(e.message)+'</p><div class="btns"><button class="btn" id="mClose">Close</button></div>'); $("mClose").onclick=closeModal; return; }
  var known = {}; myGraphs().forEach(function(g){ known[g.id]=g.title; });
  list.sort(function(a,b){ return b.updated-a.updated; });
  var html = '<h2>My saved graphs</h2>';
  if (!list.length) html += '<p>No saved graphs yet.</p>';
  else html += '<p style="font-size:12.5px">Titles you haven\'t opened on this device show as "Locked graph" until you enter the password.</p><ul class="glist">'+list.map(function(g){ return '<li><div><div class="t"></div><span>'+fmtWhen(g.updated)+'</span></div><button class="btn small" data-id="'+g.id+'">Open</button></li>'; }).join("")+'</ul>';
  html += '<div class="btns"><button class="btn" id="mClose">Close</button></div>';
  modal(html);
  var lis = $("modalBox").querySelectorAll(".glist li");
  list.forEach(function(g,i){ lis[i].querySelector(".t").textContent = known[g.id] || "Locked graph"; });
  $("mClose").onclick = closeModal;
  $("modalBox").querySelectorAll("button[data-id]").forEach(function(b){ b.onclick=function(){ closeModal(); if (location.hash==="#g="+b.dataset.id) openShared(b.dataset.id); else location.hash = "g="+b.dataset.id; }; });
}

/* ------------------------------------------------------------------ loading */
function loadDoc(d, opts){
  doc = d; doc.nodes = doc.nodes||[]; doc.edges = doc.edges||[]; reindex();
  doc.nodes.forEach(function(n){ n.vx=0; n.vy=0; if (typeof n.x!=="number"){ n.x=(Math.random()-.5)*300; n.y=(Math.random()-.5)*300; } });
  $("title").value = doc.title || "Untitled case";
  if (typeof refreshPalette==="function" && document.querySelector(".ptype .nm")) refreshPalette();
  sel = null; hist=[]; redo=[]; renderInsp(); alpha = 0.4;
  fit(); setStatus();
}
async function openShared(id){
  var text, mine = false;
  try { var g = await fetchGist(id); text = g.content; } catch(e){ toast(e.message, 6000); return; }
  if (ghToken()){
    if (myGraphs().some(function(x){ return x.id===id; })) mine = true;
    else { try { var u = await gh("GET","/user"); mine = !!(u && g.owner && u.login===g.owner); } catch(e){} }
  }
  var r = await askPassword(mine ? "Open graph" : "Shared case graph", mine ? "Enter this graph's password." : "Someone shared an encrypted case graph with you. Enter the password they gave you.", function(pw){ return decryptDoc(text, pw); });
  if (!r){ if (!isOwnerDevice()){ history.replaceState(null,"",location.pathname); setLanding(true); } else if (!doc.nodes.length) loadLocal(); return; }
  var d = r.value.doc;
  meta = { gistId:id, password: mine ? r.pw : null, dek: mine ? r.value.dek : null, owner:mine };
  setReadOnly(!mine, "link"); loadDoc(d); dirty=false; setStatus(); updateBanner();
  if (mine){ rememberGraph(id, d.title); persistLocal(); }
}
async function openView(id, keyStr){
  var dk; try { dk = unb64u(keyStr); if (dk.length!==32) throw 0; } catch(e){ toast("This view link is broken. Ask for it again.", 6000); return; }
  toast("Loading shared graph…", 1500);
  try {
    var g = await fetchGist(id), d = await decryptWithKey(g.content, dk);
    meta = { gistId:id, view:true, owner:false, password:null, dek:null };
    setReadOnly(true, "link"); loadDoc(d); dirty=false; setStatus(); updateBanner();
  } catch(e){ toast(e.message, 7000); }
}
function loadLocal(){
  setReadOnly(false);
  try {
    var s = JSON.parse(localStorage.getItem("cg.current")||"null");
    if (s && s.doc){ meta = { gistId:s.gistId||null, password:null, dek:null, owner:true }; loadDoc(s.doc); dirty = !!s.dirty; setStatus(); return; }
  } catch(e){}
  meta = { gistId:null, password:null, dek:null, owner:true }; loadDoc(blankDoc());
}
function setReadOnly(v){
  readOnly = v; document.body.classList.toggle("viewonly", v);
  $("title").readOnly = v;
  $("banner").style.display = v ? "block" : "none";
  $("banner").textContent = "View only. You can move nodes around to read the graph, but nothing can be changed or saved.";
  hideMenu(); connectFrom = null; sel=null; renderInsp(); setStatus();
}
async function updateBanner(){
  if (!readOnly) return;
  var fp = await fingerprint(doc);
  $("banner").textContent = "View only · Evidence copy" + (doc.updated ? " · last saved " + fmtWhen(doc.updated) : "") + " · fingerprint " + fp + ". You can move nodes around and export a PNG, but nothing can be changed or saved.";
}
function isOwnerDevice(){
  if (ghToken()) return true;
  try { var s = JSON.parse(localStorage.getItem("cg.current")||"null"); return !!(s && s.doc && s.doc.nodes && s.doc.nodes.length); } catch(e){ return false; }
}
function setLanding(v){ document.body.classList.toggle("landing", v); }
function route(){
  if (/^#owner$/.test(location.hash)){ history.replaceState(null,"",location.pathname); setLanding(false); loadLocal(); openSettings(false); return; }
  setLanding(!location.hash && !isOwnerDevice());
  if (document.body.classList.contains("landing")) return;
  var v = location.hash.match(/v=([a-f0-9]+)\.([A-Za-z0-9_-]+)/i);
  if (v){ if (!(meta.view && meta.gistId===v[1])) openView(v[1], v[2]); return; }
  var m = location.hash.match(/g=([a-f0-9]+)/i);
  if (m){ if (meta.gistId!==m[1] || readOnly || meta.view) openShared(m[1]); }
  else if (readOnly || !doc.nodes.length) loadLocal();
}
window.addEventListener("hashchange", route);

/* ------------------------------------------------------------------ canvas */
var cv = $("cv"), ctx = cv.getContext("2d"), W=0, H=0, DPR=1;
function resize(){ DPR = window.devicePixelRatio||1; W = innerWidth; H = innerHeight-52; cv.width=W*DPR; cv.height=H*DPR; cv.style.width=W+"px"; cv.style.height=H+"px"; }
window.addEventListener("resize", resize); resize();
view.x = W/2; view.y = H/2;

function toWorld(sx,sy){ return { x:(sx-view.x)/view.k, y:(sy-view.y)/view.k }; }

function noteBox(n){
  var lines = wrap(n.label||"Note", 150, "12px 'IBM Plex Sans', sans-serif");
  var w = 30 + Math.max.apply(null, lines.map(function(l){ ctx.font="12px 'IBM Plex Sans', sans-serif"; return ctx.measureText(l).width; }).concat([40]));
  return { w:Math.min(w,180), h:16+lines.length*15, lines:lines };
}
function wrap(text, maxW, font){
  ctx.font = font; var out=[];
  String(text).split("\n").forEach(function(par){
    var words = par.split(/\s+/), line="";
    words.forEach(function(w){ var t=line?line+" "+w:w; if (ctx.measureText(t).width>maxW && line){ out.push(line); line=w; } else line=t; });
    out.push(line);
  });
  return out.slice(0,8);
}
function nodeLabel(n){ if (n.type==="note") return ""; return n.label || (n.value ? short(n.value) : typeName(n.type)); }

function shapePath(c, type, x, y, r){
  c.beginPath();
  if (type==="tx"){ c.moveTo(x,y-r*1.25); c.lineTo(x+r*1.25,y); c.lineTo(x,y+r*1.25); c.lineTo(x-r*1.25,y); c.closePath(); }
  else if (type==="exchange"){ rrect(c, x-r, y-r, 2*r, 2*r, 5); }
  else if (type==="mixer"){ for (var i=0;i<6;i++){ var a=Math.PI/3*i+Math.PI/6; c[i?"lineTo":"moveTo"](x+r*1.1*Math.cos(a), y+r*1.1*Math.sin(a)); } c.closePath(); }

  var e = { clientX:cx, clientY:cy };
  if (readOnly) return;
  if (connectFrom) { cancelConnect(); return; }
  var p = toWorld(ox, oy), n = hitNode(p);
  if (n){
    select("node", n.id);
    showMenu(e.clientX, e.clientY, "Link from "+(nodeLabel(n)||"note"), linkItems(n).concat(["-",
      { label:"Edit details", run:function(){ var f=$("insp").querySelector("[data-k=label]"); if (f) f.focus(); } },
      { label:n.pinned?"Unpin":"Pin", run:function(){ pushHist(); n.pinned=!n.pinned; changed(); renderInsp(); } },
      { label:"Delete node", run:function(){ select("node", n.id); removeSel(); } }
    ]));
    return;
  }
  var ed = hitEdge(p);
  if (ed){
    select("edge", ed.id);
    showMenu(e.clientX, e.clientY, "Change link type", Object.keys(KINDS).map(function(k){
      return { icon:kindIcon(k), label:KINDS[k].name+(kindOf(ed)===k?"  ✓":""), run:function(){ pushHist(); ed.kind=k; if (k==="bridge" && !ed.chainTo){ var b=nodeById(ed.target); ed.chainTo=String(b&&b.chain||""); } changed(true); renderInsp(); } };
    }).concat(["-",
      { label:"Reverse direction", run:function(){ pushHist(); var t=ed.source; ed.source=ed.target; ed.target=t; changed(); renderInsp(); } },
      { label:"Delete link", run:function(){ select("edge", ed.id); removeSel(); } }
    ]));
    return;
  }
  showMenu(e.clientX, e.clientY, "Add node here", Object.keys(TYPES).map(function(t){
    return { label:typeName(t), run:function(){ var nn=addNode({ type:t, x:p.x, y:p.y, pinned:true }); select("node", nn.id); if (!coarse) setTimeout(function(){ var f=$("insp").querySelector("[data-k=label]"); if (f) f.focus(); },20); } };
  }));
}
document.addEventListener("pointerdown", function(e){ if (!$("ctx").contains(e.target)) hideMenu(); }, true);
window.addEventListener("blur", hideMenu);
function cancelConnect(){ if (connectFrom){ connectFrom=null; toast("Link cancelled", 1200); } }
cv.addEventListener("pointerdown", function(e){
  cv.setPointerCapture(e.pointerId);
  var p = toWorld(e.offsetX, e.offsetY), n = hitNode(p);
  if (e.button===2 || (e.button===0 && e.ctrlKey && /Mac/i.test(navigator.platform))) return;
  if (connectFrom){
    var from = connectFrom.from, ck = connectFrom.kind; connectFrom = null;
    if (n && n!==from && !readOnly){ newEdge(from, n, ck); return; }
    if (n===from){ toast("Pick a different node", 1500); connectFrom = { from:from, x:p.x, y:p.y, kind:ck }; return; }
    toast("Link cancelled", 1200);
  }
  var hh = hitHandle(p);
  if (hh){ rewire = { edge:hh.edge, end:hh.end, x:p.x, y:p.y }; cv.style.cursor="grabbing"; return; }
  if (n && (e.shiftKey || e.altKey) && !readOnly){ linking = { from:n, x:p.x, y:p.y }; return; }
  if (n){ select("node", n.id); drag = { node:n, dx:p.x-n.x, dy:p.y-n.y, moved:false, start:snapshot() }; return; }
  var ed = hitEdge(p);
  if (ed){ select("edge", ed.id); return; }
  select(null);
  pan = { sx:e.clientX, sy:e.clientY, vx:view.x, vy:view.y };
});
cv.addEventListener("pointermove", function(e){
  var p = toWorld(e.offsetX, e.offsetY);
  if (linking){ linking.x=p.x; linking.y=p.y; return; }
  if (rewire){ rewire.x=p.x; rewire.y=p.y; cv.style.cursor = hitNode(p) ? "copy" : "grabbing"; return; }
  if (connectFrom){ connectFrom.x=p.x; connectFrom.y=p.y; cv.style.cursor = hitNode(p) ? "copy" : "crosshair"; if (!pan) return; }
  if (drag){
    if (!drag.moved && readOnly===false) { hist.push(drag.start); redo=[]; }
    drag.moved = true; drag.node.x = p.x-drag.dx; drag.node.y = p.y-drag.dy; drag.node.pinned = true; alpha=Math.max(alpha,0.12); return;
  }
  if (pan){ view.x = pan.vx + e.clientX-pan.sx; view.y = pan.vy + e.clientY-pan.sy; return; }
  cv.style.cursor = hitHandle(p) ? "move" : hitNode(p) ? (e.shiftKey?"crosshair":"grab") : (hitEdge(p)?"pointer":"default");
});
cv.addEventListener("pointerup", function(e){
  var p = toWorld(e.offsetX, e.offsetY);
  if (rewire){
    var rw = rewire; rewire = null;
    var tn = hitNode(p), other = rw.edge[rw.end==="source"?"target":"source"];
    if (tn && tn.id!==rw.edge[rw.end]){
      if (tn.id===other){ toast("A link needs two different nodes", 1800); return; }
      pushHist(); rw.edge[rw.end] = tn.id;
      if (kindOf(rw.edge)==="bridge"){ if (rw.end==="target") rw.edge.chainTo = String(tn.chain||rw.edge.chainTo||""); else rw.edge.chain = String(tn.chain||rw.edge.chain||""); }
      changed(); renderInsp(true); toast("Link moved to "+(nodeLabel(tn)||"note"), 1500);
    }
    return;
  }
  if (linking){
    var t = hitNode(p);
    if (t && t!==linking.from) newEdge(linking.from, t);
    linking=null; return;
  }
  if (drag){ if (drag.moved) changed(true); renderInsp(); drag=null; return; }
  pan=null;
});
cv.addEventListener("dblclick", function(e){ if (!coarse) doubleAt(e.offsetX, e.offsetY); });
function doubleAt(ox, oy){
  if (readOnly) return;
  var p = toWorld(ox, oy), n = hitNode(p);
  if (n){ select("node", n.id); if (!coarse){ var f=$("insp").querySelector("[data-k=label]"); if (f) f.focus(); } return; }
  var nn = addNode({ type:curType, x:p.x, y:p.y, pinned:true });
  select("node", nn.id);
  if (!coarse){ var f=$("insp").querySelector(curType==="note"?"[data-k=label]":(curType==="address"||curType==="tx"?"[data-k=value]":"[data-k=label]")); if (f) f.focus(); }
}
cv.addEventListener("wheel", function(e){
  e.preventDefault();
  var k = Math.min(4, Math.max(0.12, view.k * Math.exp(-e.deltaY*0.0015)));
  var p = toWorld(e.offsetX, e.offsetY);
  view.k = k; view.x = e.offsetX - p.x*k; view.y = e.offsetY - p.y*k;
}, { passive:false });

document.addEventListener("keydown", function(e){
  var inField = /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
  if ((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==="z" && !inField){ e.preventDefault(); e.shiftKey?redoFn():undo(); return; }
  if ((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==="s"){ e.preventDefault(); if(!readOnly) saveCloud(); return; }
  if (inField) return;
  if ((e.key==="Delete"||e.key==="Backspace") && sel && !readOnly){ e.preventDefault(); removeSel(); }
  if (e.key==="Escape"){ if ($("ctx").classList.contains("show")) hideMenu(); else if (connectFrom) cancelConnect(); else select(null); }
  if (e.key==="l" && sel && sel.kind==="node" && !readOnly){ var sn=nodeById(sel.id); if (sn){ var sp=toScreen(sn); showLinkMenu(sn, sp.x+16, sp.y+52); } }
  if (e.key==="f"){ fit(); }
});

function addNode(o){
  pushHist();
  var n = { id:uid(), type:o.type||"address", label:o.label||"", value:o.value||"", chain:o.chain||$("chainSel").value, tags:o.tags||"", notes:o.notes||"", risk:o.risk||"",
            x:o.x!=null?o.x:(Math.random()-.5)*200, y:o.y!=null?o.y:(Math.random()-.5)*200, vx:0, vy:0, pinned:!!o.pinned };
  doc.nodes.push(n); changed(); return n;
}
function removeSel(){
  pushHist();
  if (sel.kind==="node"){ var id=sel.id; doc.nodes=doc.nodes.filter(function(n){return n.id!==id;}); doc.edges=doc.edges.filter(function(e){ return e.source!==id && e.target!==id; }); }
  else doc.edges = doc.edges.filter(function(e){ return e.id!==sel.id; });
  sel=null; reindex(); renderInsp(); changed();
}
function select(kind, id){ sel = kind ? { kind:kind, id:id } : null; renderInsp(); }

function fit(){
  var N=doc.nodes; if (!N.length){ view={x:W/2,y:H/2,k:1}; return; }
  var x0=1e9,y0=1e9,x1=-1e9,y1=-1e9; N.forEach(function(n){ x0=Math.min(x0,n.x); y0=Math.min(y0,n.y); x1=Math.max(x1,n.x); y1=Math.max(y1,n.y); });
  var k = Math.min(1.4, Math.min((W-360)/(x1-x0+160), (H-120)/(y1-y0+160)));
  view.k = Math.max(0.15,k); view.x = W/2 - (x0+x1)/2*view.k; view.y = H/2 - (y0+y1)/2*view.k;
}

// time is stored as epoch ms, edited as IST wall-clock
function msToIst(ms){ if(!ms) return ""; return new Date(ms+19800000).toISOString().slice(0,19); }
function istToMs(s){ if(!s) return null; if (s.length===16) s+=":00"; var t=Date.parse(s.slice(0,19)+"Z"); return isNaN(t)?null:t-19800000; }
function fmtIst(ms){ return new Date(ms+19800000).toISOString().slice(0,16).replace("T"," "); }
function fill(box, obj){
  box.querySelectorAll("[data-k]").forEach(function(el){
    var k = el.dataset.k;
    if (el.type==="checkbox") el.checked = !!obj[k];
    else if (k==="time"||k==="timeOut") el.value = msToIst(obj[k]);
    else if (k==="kind") el.value = kindOf(obj);
    else el.value = obj[k]==null ? "" : obj[k];
    var first = true;
    var h = function(){
      if (readOnly) return;
      if (first){ pushHist(); first=false; }
      if (el.type==="checkbox") obj[k]=el.checked;
      else if (k==="time"||k==="timeOut") obj[k] = istToMs(el.value);
      else obj[k] = el.value;
      if (k==="value") obj.value = el.value.trim();
      changed(true);
      if (k==="type"||k==="chain"||k==="kind"||k==="chainTo") renderInsp(true);
      if (k==="kind" && obj.kind==="bridge" && !obj.chainTo){ var tb=nodeById(obj.target); obj.chainTo=String(tb&&tb.chain||""); renderInsp(true); }
    };
    el.addEventListener(el.tagName==="SELECT"||el.type==="checkbox"||k==="time"||k==="timeOut" ? "change" : "input", h);
    el.addEventListener("blur", function(){ first=true; if (k==="value") setTimeout(function(){ renderInsp(true); }, 0); });
  });
}
function pullHtml(){

    '<div class="f"><label>Latest</label><select id="pN"><option>10</option><option selected>25</option><option>50</option><option>100</option></select></div></div>'+
    '<div class="row2"><div class="f"><label>Include</label><select id="pKind"><option value="all">Native + tokens</option><option value="native">Native only</option><option value="token">Tokens only</option></select></div>'+
    '<div class="f"><label>Group</label><select id="pGroup"><option value="1">By counterparty</option><option value="0">One edge per tx</option></select></div></div>'+

/* ------------------------------------------------------------------ Etherscan */
var lastCall = 0;
async function es(chain, params){
  var wait = 260 - (Date.now()-lastCall); if (wait>0) await new Promise(function(r){ setTimeout(r,wait); }); lastCall = Date.now();
  var url = new URL(ETHERSCAN_BASE);
  Object.keys(params).forEach(function(k){ url.searchParams.set(k, params[k]); });
  url.searchParams.set("chainid", chain); url.searchParams.set("apikey", ETHERSCAN_API_KEY);
  var res = await fetch(url.toString());
  if (!res.ok) throw new Error("Etherscan HTTP "+res.status);
  var j = await res.json();
  if (params.module==="proxy"){ if (j.error) throw new Error(j.error.message||"Etherscan error"); return j.result; }
  if (j.status==="0" && !/no transactions found|no records found/i.test(j.message||"")) throw new Error(typeof j.result==="string"?j.result:(j.message||"Etherscan error"));
  return Array.isArray(j.result) ? j.result : [];
}
function units(raw, dec){
  dec = Number(dec)||0; raw = String(raw||"0").replace(/^0+/,"")||"0";
  if (dec===0) return raw;
  var s = raw.padStart(dec+1,"0"), i = s.slice(0,-dec), f = s.slice(-dec).replace(/0+$/,"");
  return f ? i+"."+f.slice(0,8) : i;
}
function findNodeByValue(v, chain){
  v = String(v).toLowerCase();
  for (var i=0;i<doc.nodes.length;i++){ var n=doc.nodes[i]; if (n.value && n.value.toLowerCase()===v && (!chain || String(n.chain)===String(chain))) return n; }
  return null;
}
function ensureAddrNode(addr, chain, near, idx, total){
  var n = findNodeByValue(addr, chain); if (n) return n;
  var ang = (idx/Math.max(total,1))*Math.PI*2 + Math.random()*0.3, R = 170 + Math.random()*40;
  n = { id:uid(), type:"address", label:"", value:addr, chain:String(chain), tags:"", notes:"", risk:"",
        x:(near?near.x:0)+Math.cos(ang)*R, y:(near?near.y:0)+Math.sin(ang)*R, vx:0, vy:0, pinned:false };
  doc.nodes.push(n); return n;
}
async function pullTxs(n){
  var chain = String(n.chain||"1"), me = n.value.toLowerCase(), dir=$("pDir").value, N=+$("pN").value, kind=$("pKind").value, group=$("pGroup").value==="1", skipDust=$("pDust").checked;
  var btn=$("pullBtn"); btn.disabled=true; btn.textContent="Pulling…";
  try {
    var rows = [];
    if (kind!=="token"){
      var nat = await es(chain, { module:"account", action:"txlist", address:n.value, page:"1", offset:String(N), sort:"desc" });
      nat.forEach(function(t){ if (t.isError==="1") return; rows.push({ hash:t.hash, from:t.from, to:t.to||t.contractAddress, amount:units(t.value,18), token:(CHAINS[chain]||CHAINS["1"]).sym, time:+t.timeStamp*1000 }); });
    }
    if (kind!=="native"){
      var tok = await es(chain, { module:"account", action:"tokentx", address:n.value, page:"1", offset:String(N), sort:"desc" });
      tok.forEach(function(t){ rows.push({ hash:t.hash, from:t.from, to:t.to, amount:units(t.value,t.tokenDecimal), token:t.tokenSymbol||short(t.contractAddress), time:+t.timeStamp*1000 }); });
    }
    rows = rows.filter(function(r){
      if (!r.to) return false;
      var out = r.from.toLowerCase()===me, inn = r.to.toLowerCase()===me;
      if (dir==="out" && !out) return false; if (dir==="in" && !inn) return false;
      if (skipDust && !(Number(r.amount) > 1e-6)) return false;
      return true;
    }).sort(function(a,b){ return b.time-a.time; }).slice(0,N);
    if (!rows.length){ toast("No matching transactions found"); return; }

    pushHist();
    var cps = []; rows.forEach(function(r){ var cp = r.from.toLowerCase()===me ? r.to : r.from; if (cps.indexOf(cp.toLowerCase())<0) cps.push(cp.toLowerCase()); });
    var added = 0, before = doc.nodes.length;
    var existing = {}; doc.edges.forEach(function(e){ (e.hashes||[e.hash]).forEach(function(h){ if(h) existing[h+"|"+e.source+"|"+e.target+"|"+e.token]=1; }); });
    rows.forEach(function(r){
      var a = ensureAddrNode(r.from.toLowerCase()===me ? n.value : r.from, chain, n, cps.indexOf(r.from.toLowerCase()), cps.length);
      var b = ensureAddrNode(r.to.toLowerCase()===me ? n.value : r.to, chain, n, cps.indexOf(r.to.toLowerCase()), cps.length);
      if (r.from.toLowerCase()===me) a = n; if (r.to.toLowerCase()===me) b = n;
      if (existing[r.hash+"|"+a.id+"|"+b.id+"|"+r.token]) return;
      if (group){
        var g = doc.edges.find(function(e){ return e.auto && e.source===a.id && e.target===b.id && e.token===r.token; });
        if (g){ g.amount = String(+(Number(g.amount)+Number(r.amount)).toPrecision(12)); g.count=(g.count||1)+1; g.hashes=(g.hashes||[g.hash]).concat(r.hash); g.time=Math.min(g.time||r.time, r.time); added++; return; }
      }
      doc.edges.push({ id:uid(), source:a.id, target:b.id, amount:r.amount, token:r.token, hash:r.hash, hashes:[r.hash], time:r.time, chain:chain, auto:true, count:1 });
      added++;
    });
    alpha = 0.8; changed();
    toast("Added "+added+" transfer"+(added===1?"":"s")+", "+(doc.nodes.length-before)+" new address"+(doc.nodes.length-before===1?"":"es"));
  } catch(e){ toast(e.message, 5000); }
  finally { if ($("pullBtn")){ $("pullBtn").disabled=false; $("pullBtn").textContent="Pull from Etherscan"; } }
}

var TRANSFER_TOPIC = "0xddf252ad1be2c89b69c2b068fc378daa952ba7f163c4a11628f55a4df523b3ef";
async function addFromInput(){
  var v = $("fetchInput").value.trim(), chain = $("chainSel").value;
  if (!v) return;
  if (isAddr(v)){
    var ex = findNodeByValue(v, chain);
    if (ex){ select("node", ex.id); centerOn(ex); toast("Already on the graph"); return; }
    var c = toWorld(W/2, H/2), n = addNode({ type:"address", value:v, chain:chain, x:c.x+(Math.random()-.5)*60, y:c.y+(Math.random()-.5)*60 });
    select("node", n.id); $("fetchInput").value=""; return;
  }
  if (!isHash(v)){ toast("That's not an EVM address or tx hash"); return; }
  var btn=$("fetchBtn"); btn.disabled=true; btn.textContent="…";
  try {
    var tx = await es(chain, { module:"proxy", action:"eth_getTransactionByHash", txhash:v });
    if (!tx) throw new Error("Transaction not found on "+CHAINS[chain].name);
    var rc = await es(chain, { module:"proxy", action:"eth_getTransactionReceipt", txhash:v });
    var blk = await es(chain, { module:"proxy", action:"eth_getBlockByNumber", tag:tx.blockNumber, boolean:"false" });
    var time = blk ? parseInt(blk.timestamp,16)*1000 : null, bn = parseInt(tx.blockNumber,16);
    var transfers = [];
    var logs = (rc && rc.logs || []).filter(function(l){ return l.topics && l.topics[0]===TRANSFER_TOPIC && l.topics.length===3; });
    var tokens = []; logs.forEach(function(l){ if (tokens.indexOf(l.address)<0) tokens.push(l.address); });
    for (var i=0;i<tokens.length && i<6;i++){
      var tt = await es(chain, { module:"account", action:"tokentx", contractaddress:tokens[i], startblock:String(bn), endblock:String(bn), page:"1", offset:"200", sort:"asc" });
      tt.filter(function(t){ return t.hash.toLowerCase()===v.toLowerCase(); }).forEach(function(t){ transfers.push({ from:t.from, to:t.to, amount:units(t.value,t.tokenDecimal), token:t.tokenSymbol }); });
    }
    var val = BigInt(tx.value||"0x0");
    if (val>0n || !transfers.length) transfers.unshift({ from:tx.from, to:tx.to||(rc&&rc.contractAddress), amount:units(val.toString(),18), token:CHAINS[chain].sym, label: val>0n?"":"call" });
    pushHist();
    var c = toWorld(W/2, H/2), all=[]; transfers.forEach(function(t){ [t.from,t.to].forEach(function(a){ if (a && all.indexOf(a.toLowerCase())<0) all.push(a.toLowerCase()); }); });
    var center = { x:c.x, y:c.y };
    transfers.forEach(function(t){
      var a = ensureAddrNode(t.from, chain, center, all.indexOf(t.from.toLowerCase()), all.length);
      var b = ensureAddrNode(t.to, chain, center, all.indexOf(t.to.toLowerCase()), all.length);
      doc.edges.push({ id:uid(), source:a.id, target:b.id, amount:t.amount, token:t.token, hash:v, hashes:[v], time:time, chain:chain, label:t.label||"", count:1 });
    });
    alpha=0.8; changed(); $("fetchInput").value="";
    toast("Added "+transfers.length+" transfer"+(transfers.length===1?"":"s")+" from this tx");
  } catch(e){ toast(e.message, 5000); }
  finally { btn.disabled=false; btn.textContent="Add"; }
}
function centerOn(n){ view.x = W/2 - n.x*view.k; view.y = H/2 - n.y*view.k; }

/* ------------------------------------------------------------------ search */
var searchHits = null;
$("searchInput").addEventListener("input", function(){
  var q = this.value.trim().toLowerCase();
  if (!q){ searchHits=null; return; }
  searchHits = doc.nodes.filter(function(n){ return [n.label,n.value,n.tags,n.notes].join(" ").toLowerCase().indexOf(q)>=0; });
});
$("searchInput").addEventListener("keydown", function(e){
  if (e.key==="Enter" && searchHits && searchHits.length){ var i=(searchHits._i=((searchHits._i||0)+1)%searchHits.length); var n=searchHits[i]; centerOn(n); select("node", n.id); }
  if (e.key==="Escape"){ this.value=""; searchHits=null; this.blur(); }
});

/* ------------------------------------------------------------------ export / import */
function download(name, blob){ var a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name; document.body.appendChild(a); a.click(); setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 500); }
function slug(){ return (doc.title||"case-graph").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"") || "case-graph"; }
async function exportPng(){
  if (!doc.nodes.length){ toast("Nothing to export"); return; }
  var fp = await fingerprint(doc);
  var x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  doc.nodes.forEach(function(n){ var w = n.type==="note"?noteBox(n).w/2:70, h=n.type==="note"?noteBox(n).h/2:40; x0=Math.min(x0,n.x-w); y0=Math.min(y0,n.y-h); x1=Math.max(x1,n.x+w); y1=Math.max(y1,n.y+h); });
  var pad=50, top=52, S=2, w=x1-x0+pad*2, h=y1-y0+pad*2+top;
  var maxDim = 8000/S; if (w>maxDim||h>maxDim){ S = Math.max(0.5, Math.min(8000/w, 8000/h)); }
  var oc = document.createElement("canvas"); oc.width=Math.ceil(w*S); oc.height=Math.ceil(h*S);
  var c = oc.getContext("2d");
  c.fillStyle = css("--bg"); c.fillRect(0,0,oc.width,oc.height);
  c.setTransform(S,0,0,S,0,0);
  c.fillStyle = css("--text"); c.font="600 16px 'IBM Plex Sans', sans-serif"; c.textAlign="left"; c.textBaseline="top"; c.fillText(doc.title||"Case graph", 20, 18);
  c.fillStyle = css("--text-faint"); c.font="11px 'IBM Plex Mono', monospace"; c.textAlign="right";
  c.fillText("Exported "+fmtWhen(Date.now()), w-20, 14);
  c.fillText("Fingerprint "+fp, w-20, 29);
  c.setTransform(S,0,0,S,(-x0+pad)*S,(-y0+pad+top)*S);
  var keepSel = sel; sel=null; draw(c, { export:true }); sel=keepSel;
  oc.toBlob(function(b){ download(slug()+".png", b); });
}
function cleanDoc(){ return JSON.parse(JSON.stringify(doc, function(k,v){ return (k==="vx"||k==="vy"||k==="_lx"||k==="_ly")?undefined:v; })); }
async function exportEnc(){
  var choice = await new Promise(function(resolve){
    modal('<h2>Export encrypted file</h2><p>Who is this file for?</p>'+
      '<label style="display:flex;gap:10px;align-items:flex-start;margin-bottom:10px;cursor:pointer"><input type="radio" name="xo" value="view" checked style="margin-top:3px"><span><b>Someone else, view only</b><br><span style="color:var(--text-muted);font-size:12.5px">Opens read-only. They can move nodes and export a PNG, but can\'t edit, delete or save.</span></span></label>'+
      '<label style="display:flex;gap:10px;align-items:flex-start;cursor:pointer"><input type="radio" name="xo" value="edit" style="margin-top:3px"><span><b>Me, editable backup</b><br><span style="color:var(--text-muted);font-size:12.5px">Opens fully editable. Don\'t send this one to others.</span></span></label>'+
      '<div class="btns"><button class="btn" id="xoCancel">Cancel</button><button class="btn primary" id="xoOk">Next</button></div>');
    $("xoCancel").onclick = function(){ closeModal(); resolve(null); };
    $("xoOk").onclick = function(){ var v = $("modalBox").querySelector("input[name=xo]:checked").value; closeModal(); resolve(v); };
  });
  if (!choice) return;
  var pw = (choice==="edit" && meta.password) || await askNewPassword(choice==="view" ? "Password for this file" : null); if (!pw) return;
  var d = cleanDoc(); d.updated = d.updated || Date.now();
  if (choice==="view") d._viewOnly = true;
  var out = await encryptDoc(d, pw, null);
  download(slug()+(choice==="view"?"-view":"")+".cgraph", new Blob([out.text],{type:"application/octet-stream"}));
  toast(choice==="view" ? "View-only file downloaded. Send the password separately" : "Editable backup downloaded");
}
var importMode = null;
$("fileIn").addEventListener("change", async function(){
  var f = this.files[0]; this.value=""; if (!f) return;
  var text = await f.text();
  if (importMode==="json"){
    try { var d = JSON.parse(text); if (!d.nodes) throw 0; meta={gistId:null,password:null,owner:true}; if (location.hash) history.replaceState(null,"",location.pathname); setReadOnly(false); loadDoc(d); changed(true); toast("Imported. Save to store it in the cloud"); }
    catch(e){ toast("That file isn't a case graph JSON"); }
    return;
  }
  var r = await askPassword("Open encrypted file", "Enter the password this file was encrypted with.", function(pw){ return decryptDoc(text, pw); });
  if (!r) return;
  var d2 = r.value.doc, vo = !!d2._viewOnly; delete d2._viewOnly;
  setLanding(false);
  if (location.hash) history.replaceState(null,"",location.pathname);
  if (vo || !isOwnerDevice()){ meta={gistId:null,password:null,dek:null,owner:false,view:true}; setReadOnly(true); loadDoc(d2); dirty=false; setStatus(); updateBanner(); return; }
  meta={gistId:null,password:r.pw,dek:null,owner:true}; setReadOnly(false); loadDoc(d2); changed(true);
});

/* ------------------------------------------------------------------ UI wiring */
Object.keys(TYPES).forEach(function(t){
  var b = document.createElement("button"); b.className="ptype"+(t===curType?" on":""); b.dataset.t=t;
  var ic = document.createElement("canvas"); ic.width=ic.height=66; ic.style.width=ic.style.height="22px";
  var c = ic.getContext("2d"); c.scale(3,3);
  if (t==="note"){ c.strokeStyle=typeColor(t); c.lineWidth=1.3; c.beginPath(); rrect(c,3,4,16,14,2); c.stroke(); c.fillStyle=typeColor(t); c.fillRect(3,6,2,10); }
  else { shapePath(c, t, 11, 11, t==="tx"?7:9); c.fillStyle=typeColor(t); c.fill(); drawIcon(c, t, 11, t==="defi"?11.5:11, 10.5, dark ? "#0B1220" : "#fff", 2.6); }
  if (TYPES[t].hint) b.title = TYPES[t].hint;
  var nm = document.createElement("span"); nm.className="nm";
  var inp = document.createElement("input"); inp.maxLength=24; inp.hidden=true; inp.spellcheck=false; inp.placeholder=TYPES[t].name;
  inp.addEventListener("input", function(){
    if (readOnly) return;
    if (!rnTouched){ pushHist(); rnTouched=true; }
    doc.typeNames = doc.typeNames || {};
    var v = inp.value.trim();
    if (v && v!==TYPES[t].name) doc.typeNames[t]=v; else delete doc.typeNames[t];
    nm.textContent = typeName(t); changed(true); renderInsp();
  });
  inp.addEventListener("keydown", function(e){ if (e.key==="Enter"||e.key==="Escape") setRenaming(false); });
  b.appendChild(ic); b.appendChild(nm); b.appendChild(inp);
  b.onclick = function(){ if (renaming) return; curType=t; document.querySelectorAll(".ptype").forEach(function(x){ x.classList.toggle("on", x.dataset.t===t); }); };
  $("ptypes").appendChild(b);
});
var renaming = false, rnTouched = false;
function refreshPalette(){
  document.querySelectorAll(".ptype").forEach(function(b){
    var t=b.dataset.t, nm=b.querySelector(".nm"), inp=b.querySelector("input");
    nm.textContent = typeName(t); inp.value = typeName(t);
    nm.hidden = renaming; inp.hidden = !renaming;
  });
}
function setRenaming(v){
  renaming = v; rnTouched = false;
  $("palette").classList.toggle("renaming", v);
  $("rnLink").style.visibility = v ? "hidden" : "";
  refreshPalette();
  if (v){ var f=$("palette").querySelector(".ptype input"); if (f){ f.focus(); f.select(); } }
}
$("rnLink").onclick = function(){ setRenaming(true); };
$("rnLink2").onclick = function(){ setRenaming(true); };
$("rnDone").onclick = function(){ setRenaming(false); };
$("rnReset").onclick = function(){ pushHist(); doc.typeNames = {}; changed(true); renderInsp(); refreshPalette(); };
refreshPalette();
$("chainSel").innerHTML = chainOpts("1");
$("fetchBtn").onclick = addFromInput;
$("landOpen").onclick = function(){
  var t = $("landLink").value.trim(), i = t.indexOf("#");
  if (i<0 || !/#(v|g)=/.test(t.slice(i))){ toast("That doesn't look like a shared graph link"); return; }
  location.hash = t.slice(i+1);
};
$("landLink").addEventListener("keydown", function(e){ if (e.key==="Enter") $("landOpen").click(); });
$("landFile").onclick = function(){ importMode="enc"; $("fileIn").removeAttribute("accept"); $("fileIn").click(); };
$("fetchInput").addEventListener("keydown", function(e){ if (e.key==="Enter") addFromInput(); });
$("title").addEventListener("input", function(){ if (readOnly) return; doc.title = this.value; changed(true); });
$("undoBtn").onclick = undo;
$("layoutBtn").onclick = function(){ pushHist(); doc.nodes.forEach(function(n){ n.pinned=false; }); alpha=1; $("physics").checked=true; setTimeout(fit, 1200); };
$("physics").onchange = function(){ if (this.checked) alpha=Math.max(alpha,0.3); };
$("saveBtn").onclick = saveCloud;
$("shareBtn").onclick = openShare;
document.querySelectorAll(".menu").forEach(function(m){
  m.firstElementChild.onclick = function(e){ e.stopPropagation(); var o=m.classList.contains("open"); document.querySelectorAll(".menu").forEach(function(x){ x.classList.remove("open"); }); if(!o) m.classList.add("open"); };
});
document.addEventListener("click", function(){ document.querySelectorAll(".menu").forEach(function(x){ x.classList.remove("open"); }); });
document.querySelectorAll(".menu-list button").forEach(function(b){
  b.onclick = function(){
    var a = b.dataset.act;
    if (a==="undo") undo();
    if (a==="relayout") $("layoutBtn").click();
    if (a==="new"){ if (doc.nodes.length && dirty && !meta.gistId && !window.confirm("Start a new graph? The current draft isn't saved to the cloud.")) return; meta={gistId:null,password:null,owner:true}; history.replaceState(null,"",location.pathname); setReadOnly(false); loadDoc(blankDoc()); changed(true); }
    if (a==="mine") openMine();
    if (a==="settings") openSettings(false);
    if (a==="importEnc"){ importMode="enc"; $("fileIn").removeAttribute("accept"); $("fileIn").click(); }
    if (a==="importJson"){ importMode="json"; $("fileIn").removeAttribute("accept"); $("fileIn").click(); }
    if (a==="png") exportPng();
    if (a==="json") download(slug()+".json", new Blob([JSON.stringify(cleanDoc(),null,1)],{type:"application/json"}));
    if (a==="enc") exportEnc();
  };
});
window.addEventListener("pagehide", function(){ if (!readOnly){ try { localStorage.setItem("cg.current", JSON.stringify({ doc:cleanDoc(), gistId:meta.gistId, dirty:dirty })); } catch(e){} } });
window.addEventListener("beforeunload", function(e){ if (dirty && meta.gistId && !readOnly){ e.preventDefault(); e.returnValue=""; } });
if (window.matchMedia) matchMedia("(prefers-color-scheme: dark)").addEventListener("change", function(e){ dark=e.matches; });

route();
if (coarse && !readOnly){ try { if (!localStorage.getItem("cg.mhelp")){ setTimeout(function(){ toast("Double-tap to add · Long-press a node to link · Pinch to zoom", 5000); }, 900); localStorage.setItem("cg.mhelp","1"); } } catch(e){} }
requestAnimationFrame(frame);
})();
